<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign UP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href= "myStyle.css">
    <script src="netdna.bootstrapcdn.com/bootstrap/3.1.1/js/bootstrap.min.js"></script>
</head>
  <body>
    <header>
        <h1> Plastic Makers<sub>inc</sub></h1>
    </header>
        <section>
        <form>
            <div class="Heading">
                <h2>User Signup</h2>
            </div>

            <div class="form-group">
                <label for="Username">User name: </label><br>
                <input type="Username" class="form-control" id="Username" placeholder="Enter Username" name="Username">
            </div>

            <br>

            <div class="form-group">
                <label for="email">Email: </label><br>
                <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
            </div>

            <br>

            <div class="form-group">
                <label for="pwd">Password: </label><br>
                <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pwd">
            </div>

            <br>

            <div class="form-group">
                <label for="pwd">  Confirm Password: </label><br>
                <input type="password" class="form-control" id="pass" placeholder="Enter confirm password" name="pwd">
            </div>

            <br>

            <div class="button">
                <button type="submit" class="btn btn-default">Submit</button>
            </div>

            <br>

           <div class="button">
               <button type="button" class="btn btn-default"> <a href="Home.html">Return Home</a> </button>
           </div>

        </form>
    </section>
