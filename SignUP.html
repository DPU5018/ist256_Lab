<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign UP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href= "myStyle.css">
    <script src="SignUp.js"></script>
</head>
  <body>
    <header>
        <h1> Plastic Makers<sub>inc</sub></h1>
    </header>
        <section>
            <div id="SignUpError"></div>
        <form id="SignUP" action="/" method="get">
            <div class="Heading">
                <h2>User Signup</h2>
            </div>
            <div>
                <label for="Username">User name: </label><br>
                <input id="Username" placeholder="User name" name="Username" type="text" required>
            </div>
            <br>
            <div >
                <label for="email">Email: </label><br>
                <input  id="email" placeholder="Enter email" name="email" type="email" required>
            </div>
            <br>
            <div >
                <label for="pwd">Password: </label><br>
                <input  id="pwd" placeholder="Enter password" name="pwd" type="password" required>
            </div>
            <br>
            <div>
                <label for="pass">  Confirm Password: </label><br>
                <input id="pass" placeholder="Enter confirm password" name="pass" type="password" required>
            </div>
            <br>
            <div>
                <button type="submit">Submit</button>
                <br>
                <input class="Reset" type="reset" value="Reset">
            </div>
            <br>
        </form>
            <div>
                <button type="button"> <a href="index.html">Return Home</a> </button>
            </div>
    </section>

    <footer>
            <p>Plastic Makers<sub>inc est 2025</sub></p>
            <div>
                <i> <a href="TermsofUse.html">Terms of Use</a> . . .  <a href="CookieandPrivacy.html">Cookie and Privacy policy</a> . . . <a href="Copyright.html">Copyright</a> </i>
            </div>
    </footer>

  </body>
</html>
